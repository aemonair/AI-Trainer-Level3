[project]
name = "ai-trainer-env"
version = "0.1.0"
description = "人工智能训练师环境（基于指南锁定版本）"
requires-python = "==3.9.7"
dependencies = [
    # 通用依赖（跨平台兼容的版本）
    "matplotlib==3.4.3",
    "seaborn==0.11.2",
    "Pillow==8.4.0",
    "openpyxl==3.0.9",
    "xlrd==2.0.1",
    "onnxruntime==1.12.1",
    "xgboost==2.1.1",
    "opencv-python==4.10.0.84",
    "imbalanced-learn==0.8.1",
    "notebook==6.4.5",
    "traitlets==5.9.0",
    "matplotlib-inline==0.1.6",
    # Windows (x86_64) 专用版本
    "pandas==1.3.4; sys_platform == 'win32'",
    "scikit-learn==0.24.2; sys_platform == 'win32'",
    "scipy==1.7.1; sys_platform == 'win32'",
    "onnx==1.10.2; sys_platform == 'win32'",
    # macOS ARM64 专用版本（兼容 Apple Silicon 的较新版本）
    "pandas==1.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scikit-learn==1.0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scipy==1.9.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnx==1.13.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # macOS x86_64 (Intel) 使用 Windows 相同版本
    "pandas==1.3.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scikit-learn==0.24.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scipy==1.7.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnx==1.10.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Linux 使用 Windows 相同版本
    "pandas==1.3.4; sys_platform == 'linux'",
    "scikit-learn==0.24.2; sys_platform == 'linux'",
    "scipy==1.7.1; sys_platform == 'linux'",
    "onnx==1.10.2; sys_platform == 'linux'",
]

[tool.setuptools]
py-modules = []